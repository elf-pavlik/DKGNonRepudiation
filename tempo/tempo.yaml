stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  # Default is 2048, which truncated every payload over 2 KB. Must be >= VERA_PAYLOAD_MAX_LENGTH.
  max_attribute_bytes: 65536
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

query_frontend:
  mcp_server:
    enabled: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
